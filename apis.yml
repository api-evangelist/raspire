name: Raspire
description: Raspire (RASPIRE) provides runtime security for mobile applications, positioning itself as
  the first line of defense for Android and iOS apps against AI-powered fraud attacks, API abuse, and
  runtime threats. Developers upload compiled apps (APK/IPA) and Raspire automatically hardens them with
  anti-fraud protection, app integrity verification, reverse-engineering prevention, and API protection,
  without requiring changes to application source code. The platform gives security teams real-time visibility
  into threats and blocks attacks in real time, and can integrate with existing SIEM systems and application
  monitoring platforms as part of a CI/CD pipeline. Raspire is a Y Combinator company. As surfaced to
  the API Evangelist network it does not publish a public developer API, OpenAPI specification, or SDKs;
  this profile captures its identity and probed domain-security posture.
